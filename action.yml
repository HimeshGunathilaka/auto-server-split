name: auto-server-split
description: Check a Next.js app for "use client" components that can be split into a Server Component plus client islands.
author: Himesh Gunathilake
branding:
  icon: scissors
  color: green

inputs:
  working-directory:
    description: The project root (where tsconfig.json lives), relative to the repository.
    default: .
  paths:
    description: Files or directories to check, separated by spaces (default, the config's include globs).
    default: ""
  since:
    description: Only check files changed since this git ref, e.g. origin/main. Needs that ref fetched (actions/checkout with fetch-depth 0).
    default: ""
  baseline:
    description: A baseline file (written with --write-baseline) whose files are left as they are.
    default: ""
  version:
    description: The auto-server-split version to run (1.0.2 or later). Empty runs the project's own installed copy, which must be 1.0.2 or later.
    default: ""
  fail-on-changes:
    description: Fail the step when a change is available.
    default: "true"
  args:
    description: Extra command-line arguments, e.g. --remove-unused-directives.
    default: ""

runs:
  using: composite
  steps:
    - name: auto-server-split --check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        AUTO_SPLIT_PATHS: ${{ inputs.paths }}
        AUTO_SPLIT_SINCE: ${{ inputs.since }}
        AUTO_SPLIT_BASELINE: ${{ inputs.baseline }}
        AUTO_SPLIT_VERSION: ${{ inputs.version }}
        AUTO_SPLIT_FAIL: ${{ inputs.fail-on-changes }}
        AUTO_SPLIT_ARGS: ${{ inputs.args }}
      run: |
        args=(--check --format github)
        # The step reports through --format github (annotations, job summary); another format would
        # replace it silently.
        case " $AUTO_SPLIT_ARGS " in
          *" --format"* | *" --json "* | *" --output"*)
            echo "::error::The action reports with --format github, so args can't set --format, --json or --output. Run npx auto-server-split in a separate step for a SARIF, GitLab or HTML report."
            exit 1
            ;;
        esac
        if [ -n "$AUTO_SPLIT_SINCE" ]; then args+=(--since "$AUTO_SPLIT_SINCE"); fi
        if [ -n "$AUTO_SPLIT_BASELINE" ]; then args+=(--baseline "$AUTO_SPLIT_BASELINE"); fi
        if [ -n "$AUTO_SPLIT_VERSION" ]; then
          runner=(npx --yes "auto-server-split@$AUTO_SPLIT_VERSION")
        else
          runner=(npx --no-install auto-server-split)
        fi
        # --format github, --since and --baseline need 1.0.2 or later.
        installed=$("${runner[@]}" --version 2>/dev/null | tail -n 1 || true)
        case "$installed" in
          "")
            echo "::error::auto-server-split isn't installed in $PWD. Add it to the project's devDependencies, or set the action's version input."
            exit 1
            ;;
          0.* | 1.0.0 | 1.0.1)
            if [ -n "$AUTO_SPLIT_VERSION" ]; then
              fix="Set the action's version input to 1.0.2 or later."
            else
              fix="Upgrade the project's copy, or set the action's version input."
            fi
            echo "::error::auto-server-split $installed is too old for this action, which needs 1.0.2 or later. $fix"
            exit 1
            ;;
        esac
        set +e
        # Paths and extra arguments are word-split on purpose.
        # shellcheck disable=SC2086
        "${runner[@]}" $AUTO_SPLIT_PATHS "${args[@]}" $AUTO_SPLIT_ARGS
        code=$?
        set -e
        if [ "$code" -eq 2 ] && [ "$AUTO_SPLIT_FAIL" != "true" ]; then
          echo "Changes are available (fail-on-changes is off)."
          exit 0
        fi
        exit "$code"
